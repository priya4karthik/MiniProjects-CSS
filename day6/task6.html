<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    padding: 40px 0;
}

.container {
    width: 90%;
    margin: auto;
}

.title {
    text-align: center;
    margin-bottom: 40px;
    font-size: 32px;
}

/* --- GRID LAYOUT --- */
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 35px;
}

/* --- TEAM CARD --- */
.team-card {
    position: relative;
    padding: 40px 20px 20px;
    text-align: center;
    border-radius: 30px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
}

/* CURVED BACKGROUND BLOB */
.team-card::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 180%;
    height: 75%;
    border-radius: 0 0 200px 200px;
    z-index: -1;
}

/* COLORS */
.pink::before { background: #f8c7e5; }
.yellow::before { background: #f3e4a1; }
.green::before { background: #c9f2d2; }
.peach::before { background: #f5c5b8; }

/* IMAGE */
.photo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 10px;
}

/* TEXT */
.team-card h2 {
    margin-top: 12px;
    font-size: 20px;
    color: #222;
}

.team-card p {
    margin-top: 6px;
    font-size: 14px;
    color: #666;
}

/* PLUS BUTTON */
.plus {
    position: absolute;
    top: 15px;
    right: 20px;
    background: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
}

/* SOCIAL ICON BOX (3rd Card) */
.social {
    position: absolute;
    top: 15px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.social a {
    width: 32px;
    height: 32px;
    background: #fff;
    text-align: center;
    line-height: 32px;
    border-radius: 50%;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    font-size: 16px;
    text-decoration: none;
    color: #444;
}

    </style>
</head>
<body>

<div class="container">
    <h1 class="title">Our Team</h1>

    <div class="team-grid">

        <!-- Card 1 -->
        <div class="team-card pink">
            <span class="plus">+</span>
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cHJvZmlsZSUyMGltYWdlfGVufDB8fDB8fHww" class="photo">
            <h2>Danny Russell</h2>
            <p>Founder & CEO</p>
        </div>

        <!-- Card 2 -->
        <div class="team-card yellow">
            <span class="plus">+</span>
            <img src="https://images.ctfassets.net/h6goo9gw1hh6/2sNZtFAWOdP1lmQ33VwRN3/24e953b920a9cd0ff2e1d587742a2472/1-intro-photo-final.jpg?w=1200&h=992&fl=progressive&q=70&fm=jpg" class="photo">
            <h2>Ezekiel Pearce</h2>
            <p>UI UX Designer</p>
        </div>

        <!-- Card 3 (with social icons) -->
        <div class="team-card green">
            <div class="social">
                <a href="#">-</a>
                <a href="#">f</a>
                <a href="#">x</a>
                <a href="#">◎</a>
            </div>
            <img src="https://t3.ftcdn.net/jpg/06/99/46/60/360_F_699466075_DaPTBNlNQTOwwjkOiFEoOvzDV0ByXR9E.jpg" class="photo">
            <h2>Byron Conner</h2>
            <p>Plugin Developer</p>
        </div>

        <!-- Card 4 -->
        <div class="team-card peach">
            <span class="plus">+</span>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTN3-b6hE_5K-l4bv_gBuFtF5zWoPEhSkLsuw&s" class="photo">
            <h2>Anna Lin</h2>
            <p>Product Designer</p>
        </div>

    </div>
</div>

</body>
</html>
