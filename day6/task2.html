<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Section</title>
    <link rel="stylesheet" href="style.css">
<style>
    /* GLOBAL SETTINGS */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Header Section */
.header {
    background: linear-gradient(to right, #f65a2a, #f18c1a);
    text-align: center;
    padding: 40px 20px;
    color: #fff;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.header p {
    font-size: 14px;
}

/* Feature Section */
.feature-box {
    width: 80%;
    max-width: 900px;
    background: #fff;
    margin: 30px auto;
    padding: 30px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    height: 60vh;
}

.feature-img {
    width: 90px;
    margin-bottom: 15px;
}

.feature-box h2 {
    margin-bottom: 10px;
    font-size: 22px;
    font-weight: 600;
}

.feature-box p {
    font-size: 14px;
    color: #444;
}

/* Footer */
.footer {
    background: #000;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 13px;
    margin-top: 20px;
}

</style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>Welcome to Our Landing Page</h1>
        <p>Discover amazing features and services</p>
    </header>

    <!-- Feature Section -->
    <section class="feature-box">
        <img src="https://vetritechnologysolutions.com/uploads/logo/1/VETRI%20TECHNOLOGY%20SOLUTIONS_49681133_logo.jpg" alt="Company Logo" class="feature-img">
        
        <h2>Why Choose Us?</h2>
        <p>
            We provide high-quality services to help you grow your business.
        </p>
    </section>

    <!-- Footer -->
    <footer class="footer">
        © 2025 Vetri Technology Solutions. All rights reserved.
    </footer>

</body>
</html>
