<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Card Layout</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    box-sizing: border-box;
}

body {
    background: #f2f4f7;
    padding: 40px;
}

.title {
    text-align: center;
    margin-bottom: 40px;
    font-size: 2.4rem;
    font-weight: 600;
    color: #333;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    padding: 20px;
}

.card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: 0.3s ease;
    text-align: center;
    padding-bottom: 20px;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.12);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card h3 {
    margin: 15px 0 8px;
    color: #222;
    font-size: 1.3rem;
}

.card p {
    margin: 0 20px 20px;
    color: #555;
    font-size: 0.95rem;
}

.card button {
    padding: 10px 20px;
    background: #4a63e7;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease;
}

.card button:hover {
    background: #394ecc;
}

    </style>
</head>
<body>

    <h1 class="title">Modern Card Layout</h1>

    <div class="card-container">

        <div class="card">
            <img src="https://picsum.photos/300?random=1" alt="Image">
            <h3>Card Title One</h3>
            <p>This is a simple modern card layout using HTML and CSS.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300?random=2" alt="Image">
            <h3>Card Title Two</h3>
            <p>Clean shadows, smooth hover effects, and a minimal layout.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300?random=3" alt="Image">
            <h3>Card Title Three</h3>
            <p>Perfect for mini projects and beginner portfolios.</p>
            <button>Read More</button>
        </div>

    </div>

</body>
</html>
