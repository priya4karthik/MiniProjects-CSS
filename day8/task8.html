<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Signup Banner</title>
<style>
/* Reset & base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f3f4f6;
    color: #333;
}

/* Newsletter Section */
.newsletter-section {
    display: flex;
    justify-content: center;
    padding: 60px 20px;
}

.newsletter-container {
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    padding: 30px 40px;
    border-radius: 15px;
    max-width: 900px;
    width: 100%;
    color: #fff;
    flex-wrap: wrap;
}

/* Banner Text */
.newsletter-text {
    flex: 1;
    min-width: 250px;
}

.newsletter-text h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.newsletter-text p {
    font-size: 16px;
    color: #fff;
}

/* Input & Button */
.newsletter-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1;
    min-width: 250px;
}

.newsletter-form input[type="email"] {
    flex: 1;
    padding: 12px 15px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

.newsletter-form button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background-color: #fff;
    color: #ff416c;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
}

.newsletter-form button:hover {
    background-color: #ffe5e5;
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 700px) {
    .newsletter-container {
        flex-direction: column;
        align-items: stretch;
    }
    .newsletter-form {
        flex-direction: column;
        width: 100%;
    }
    .newsletter-form button {
        width: 100%;
    }
}
</style>
</head>
<body>

<section class="newsletter-section">
    <div class="newsletter-container">
        <div class="newsletter-text">
            <h2>Stay Updated!</h2>
            <p>Subscribe to our newsletter and get the latest updates and offers.</p>
        </div>
        <form class="newsletter-form">
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Subscribe</button>
        </form>
    </div>
</section>

</body>
</html>
