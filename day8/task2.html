<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feature Section</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    padding: 30px;
    text-align: center;
    
}

.features {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap; /* Responsive layout */
    justify-content: center;
}

.feature {
    background: #fff;
    padding: 20px;
    width: 300px;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* 🎯 Feature images */
.feature-img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
}

/* ✨ flex-grow: second feature takes more horizontal space */
.feature2 {
    flex-grow: 1;
}

/* ✨ align-self for icon alignment */
.feature1 .icon {
    align-self: flex-start;
}
.feature2 .icon {
    align-self: center;
}
.feature3 .icon {
    align-self: flex-end;
}

.icon {
    font-size: 40px;
}

h3 {
    color: #333;
}

p {
    color: #666;
    line-height: 1.4;
}

/* Responsive for small screens */
@media (max-width: 768px) {
    .feature {
        width: 100%;
    }
}

    </style>
</head>
<body>
<h2>Our Features</h2>
<section class="features">
    
    <div class="feature feature1">
        <img src="https://images.pexels.com/photos/1181316/pexels-photo-1181316.jpeg?auto=compress&cs=tinysrgb&w=600" class="feature-img" alt="Feature Image">
        <div class="icon">💡</div>
        <h3>Innovative Ideas</h3>
        <p>Creative and modern solutions to everyday problems.</p>
    </div>

    <div class="feature feature2">
        <img src="https://images.pexels.com/photos/3184465/pexels-photo-3184465.jpeg?auto=compress&cs=tinysrgb&w=600" class="feature-img" alt="Feature Image">
        <div class="icon">⚙️</div>
        <h3>Advanced Tools</h3>
        <p>High-quality tools built for excellent performance.</p>
    </div>

    <div class="feature feature3">
        <img src="https://images.pexels.com/photos/3861969/pexels-photo-3861969.jpeg?auto=compress&cs=tinysrgb&w=600" class="feature-img" alt="Feature Image">
        <div class="icon">🚀</div>
        <h3>Fast Performance</h3>
        <p>Optimized and scalable for rapid results.</p>
    </div>
</section>

</body>
</html>
