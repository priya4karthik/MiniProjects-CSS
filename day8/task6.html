<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Navbar</title>
<style>
/* Reset & base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f3f4f6;
    color: #333;
}

/* Navbar container */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    padding: 15px 40px;
    background-color: #1f2937;
    color: #fff;
}

/* Logo */
nav .logo {
    font-size: 24px;
    font-weight: 700;
}

/* Navigation links */
nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
    flex-wrap: wrap;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
}

nav ul li a:hover {
    color: #ff416c;
}

/* Button on right */
nav .nav-button {
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s;
}

nav .nav-button:hover {
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    nav ul {
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 15px;
    }

    nav .nav-button {
        align-self: stretch;
        text-align: center;
    }
}
</style>
</head>
<body>

<nav>
    <div class="logo">MyLogo</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <button class="nav-button">Sign Up</button>
</nav>

</body>
</html>
