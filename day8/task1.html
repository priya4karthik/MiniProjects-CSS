<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
   <style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    padding: 20px;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.card-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: #fff;
    width: 300px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding-bottom: 20px;
    transition: 0.3s;
}

.card img {
    width: 100%;
    height: 200px;
    border-radius: 8px 8px 0 0;
}

.card h3 {
    margin: 15px;
    color: #444;
}

.card p {
    margin: 0 15px 15px;
    color: #666;
    line-height: 1.5;
}

.card button {
    margin-left: 15px;
    padding: 10px 20px;
    background: #007BFF;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.card button:hover {
    background: #0056b3;
}

.card:hover {
    transform: translateY(-5px);
}

   </style>
</head>
<body>

    <h1 class="heading">Card Layout Mini Project</h1>

    <div class="card-container">

        <div class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Card Image">
            <h3>Card Title 1</h3>
            <p>This is a sample description for the card layout using HTML and CSS.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Card Image">
            <h3>Card Title 2</h3>
            <p>Responsive design ensures the layout looks great on all devices.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Card Image">
            <h3>Card Title 3</h3>
            <p>This project helps you understand CSS Flexbox and card styling.</p>
            <button>Read More</button>
        </div>

    </div>

</body>
</html>
