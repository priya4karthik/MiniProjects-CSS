<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Contact Section</title>
<style>
/* Reset & base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f3f4f6;
    color: #333;
    background-image: url("https://static-cse.canva.com/blob/1145215/1.magebyRodionKutsaevviaUnsplash.jpg");
}

/* Contact Section */
.contact-section {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 50px;
    padding: 60px 40px;
    max-width: 1200px;
    margin: auto;
}

/* Contact Form */
.contact-form {
    flex: 1;
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
}

.contact-form h2 {
    margin-bottom: 20px;
    font-size: 28px;
    color: #1f2937;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
     border: 1px solid #ccc;
    /* border: none; */
    
     border-radius: 8px;
    font-size: 14px;
    resize: vertical;
}

.contact-form button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s;
}

.contact-form button:hover {
    transform: scale(1.05);
}

/* Contact Info */
.contact-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 25px;
    padding: 30px;
    background:black;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.contact-info h3 {
    font-size: 22px;
    margin-bottom: 10px;
 color: white;
    /* color: #1f2937; */
}

.contact-info p {
    font-size: 16px;
    line-height: 1.6;
    color: #555;
    color: white;
}

/* Icons for contact info */
.contact-info p i {
    color: #ff416c;
    margin-right: 10px;
}

/* Responsive */
@media (max-width: 900px) {
    .contact-section {
        flex-direction: column;
        gap: 30px;
    }
}
</style>
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<section class="contact-section">

    <!-- Contact Form -->
    <form class="contact-form">
        <h2>Get in Touch</h2>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>

    <!-- Contact Info -->
    <div class="contact-info">
        <h3>Contact Information</h3>
        <p><i class="fas fa-phone"></i> +91 98765 43210</p>
        <p><i class="fas fa-envelope"></i> contact@example.com</p>
        <p><i class="fas fa-map-marker-alt"></i> 123 Main Street, City, Country</p>
    </div>

</section>

</body>
</html>
