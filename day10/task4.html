<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <style>
        /* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* GRID LAYOUT */
.dashboard {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 70px 1fr 60px;
    height: 100vh;
}

/* GRID AREAS USING grid-row / grid-column */
.header {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
    background: #333;
    color: #fff;
    display: flex;               /* Nested Flexbox */
    align-items: center;
    padding-left: 20px;
}

.sidebar {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    background: #222;
    color: #fff;
    padding: 20px;
}

/* SIDEBAR MENU USING FLEXBOX */
.menu {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu a {
    color: white;
    text-decoration: none;
    font-size: 1rem;
}

/* MAIN CONTENT AREA */
.content {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
    padding: 20px;
    background: #f4f4f4;
    overflow-y: auto;
}

/* CARDS SECTION — FLEXBOX NESTED INSIDE GRID */
.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    text-align: center;
    font-weight: bold;
}

.details {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* FOOTER */
.footer {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
    background: #333;
    color: #fff;
    display: flex;              /* Nested Flexbox */
    justify-content: center;
    align-items: center;
}

/* RESPONSIVE */
@media (max-width: 800px) {
    .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: 70px auto auto 60px;
    }

    .sidebar {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
    }

    .content {
        grid-column: 1 / 2;
        grid-row: 3 / 4;
    }
}

    </style>
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h1>Dashboard</h1>
        </header>

        <aside class="sidebar">
            <nav class="menu">
                <a href="#">Overview</a>
                <a href="#">Reports</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="content">
            <div class="cards">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
            </div>

            <div class="details">
                <h2>Details Section</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>
        </main>

        <footer class="footer">
            &copy; 2025 Dashboard
        </footer>

    </div>

</body>
</html>
