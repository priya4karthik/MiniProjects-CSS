<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-scale, initial-scale=1.0">
    <title>Product Showcase</title>
    <style>/* GENERAL RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    padding: 20px;
}

/* HEADER */
.header {
    text-align: center;
    font-size: 1.6rem;
    font-weight: bold;
    margin-bottom: 25px;
}

/* PRODUCT GRID */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* PRODUCT CARD */
.product-card {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    text-align: center;
}

.product-card img {
    width: 100%;
    height:180px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.product-card h3 {
    margin-bottom: 8px;
}

.product-card p {
    font-weight: bold;
    margin-bottom: 10px;
    color: #333;
}

.product-card button {
    background: #333;
    color: #fff;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
}

.product-card button:hover {
    background: #555;
}

/* RESPONSIVE */
@media (max-width: 480px) {
    .header {
        font-size: 1.3rem;
    }
}
</style>
</head>
<body>

    <header class="header">
        Featured Products
    </header>

    <section class="product-grid">

        <div class="product-card">
            <img src="https://img.freepik.com/free-photo/modern-stationary-collection-arrangement_23-2149309643.jpg?semt=ais_hybrid&w=740&q=80" alt="Product 1">
            <h3>Laptop</h3>
            <p>$19.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://www.schott.com/-/media/project/onex/shared/teasers/consumer-electronics/consumer-electronics_01-displays_00_720x450.jpg?rev=fe6df7a508644a7d8e294e6c294a317b" alt="Product 2">
            <h3>Smart Watch</h3>
            <p>$29.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1496878632226-93afc36151ab?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8ZWxlY3Ryb25pYyUyMGRldmljZXxlbnwwfHwwfHx8MA%3D%3D" alt="Product 3">
            <h3>Wireless Mouse</h3>
            <p>$39.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://sopa.tulane.edu/sites/default/files/2024-06/tulane-sopa-vr-blog-photo.jpeg" alt="Product 4">
            <h3>VR</h3>
            <p>$49.99</p>
            <button>Add to Cart</button>
        </div>

    </section>

</body>
</html>
