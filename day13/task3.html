<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Gallery</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f5f5f5;
    padding: 20px;
}

.title {
    text-align: center;
    margin-bottom: 20px;
}

/* Gallery Grid */
.gallery {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

/* Product Card */
.product {
    background-color: #ffffff;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.product img {
    width: 100%;
    max-width: 200px;
    height: auto;
    margin-bottom: 10px;
}

/* Tablet View (2 Columns) */
@media (min-width: 600px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Desktop View (4 Columns) */
@media (min-width: 1024px) {
    .gallery {
        grid-template-columns: repeat(4, 1fr);
    }
}

    </style>
</head>
<body>

    <h1 class="title">Product Gallery</h1>

    <div class="gallery">
       <div class="product">
    <img src="https://picsum.photos/200?random=1" alt="Product 1">
    <h3>Product 1</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=2" alt="Product 2">
    <h3>Product 2</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=3" alt="Product 3">
    <h3>Product 3</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=4" alt="Product 4">
    <h3>Product 4</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=5" alt="Product 5">
    <h3>Product 5</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=6" alt="Product 6">
    <h3>Product 6</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=7" alt="Product 7">
    <h3>Product 7</h3>
</div>
<div class="product">
    <img src="https://picsum.photos/200?random=8" alt="Product 8">
    <h3>Product 8</h3>
</div>

    </div>

</body>
</html>
