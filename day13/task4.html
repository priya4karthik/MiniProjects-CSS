<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    line-height: 1.6;
    background-color: #f4f4f4;
}

/* Hero Section */
.hero {
    background-color: #007bff;
    color: #ffffff;
    text-align: center;
    padding: 80px 20px;
}

.hero h1 {
    font-size: 3rem;
    margin-bottom: 15px;
}

.hero p {
    font-size: 1.2rem;
    margin-bottom: 25px;
}

.cta-btn {
    background-color: #ffffff;
    color: #007bff;
    padding: 15px 30px;
    border: none;
    font-size: 1.1rem;
    border-radius: 5px;
    cursor: pointer;
}

/* Features Section */
.features {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 40px 20px;
}

.feature-card {
    background-color: #ffffff;
    padding: 25px;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.feature-card h3 {
    margin-bottom: 10px;
}

/* Tablet View */
@media (min-width: 600px) {
    .hero h1 {
        font-size: 2.5rem;
    }

    .features {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Desktop View */
@media (min-width: 1024px) {
    .hero h1 {
        font-size: 3.2rem;
    }

    .features {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Mobile Optimization */
@media (max-width: 599px) {
    .hero {
        padding: 60px 15px;
    }

    .hero h1 {
        font-size: 2rem;
    }

    .hero p {
        font-size: 1rem;
    }

    .cta-btn {
        padding: 12px 20px;
        font-size: 1rem;
    }
}

    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Our Product</h1>
        <p>Build modern, responsive websites easily and efficiently.</p>
        <button class="cta-btn">Get Started</button>
    </section>

    <!-- Features Section -->
    <section class="features">
        <div class="feature-card">
            <h3>Fast Performance</h3>
            <p>Optimized for speed and performance.</p>
        </div>
        <div class="feature-card">
            <h3>Responsive Design</h3>
            <p>Looks great on all devices.</p>
        </div>
        <div class="feature-card">
            <h3>Easy Customization</h3>
            <p>Simple and flexible code structure.</p>
        </div>
    </section>

</body>
</html>
