<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Navbar</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f0f2f5;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2196f3;
    padding: 15px 20px;
    color: #fff;
    position: sticky;
    top: 0;
}

/* Logo */
.navbar .logo {
    font-size: 1.5em;
    font-weight: bold;
}

/* Nav links */
.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
}

.nav-links li a {
    text-decoration: none;
    color: #fff;
    transition: color 0.3s;
}

.nav-links li a:hover {
    color: #ffeb3b;
}

/* Hamburger menu */
.hamburger {
    display: none;
    font-size: 1.8em;
    cursor: pointer;
}

/* Checkbox toggle */
#toggle {
    display: none;
}

/* Responsive */
@media screen and (max-width: 768px) {
    .nav-links {
        position: absolute;
        top: 60px;
        left: -100%;
        flex-direction: column;
        background: #2196f3;
        width: 100%;
        transition: left 0.3s;
    }

    .nav-links li {
        text-align: center;
        margin: 15px 0;
    }

    #toggle:checked + .hamburger + .nav-links {
        left: 0;
    }

    .hamburger {
        display: block;
    }
}

    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">VetriTech</div>
    <input type="checkbox" id="toggle">
    <label for="toggle" class="hamburger">&#9776;</label>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

</body>
</html>
