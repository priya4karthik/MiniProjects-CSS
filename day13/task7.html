<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Footer</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.footer {
    background-color: #222;
    color: #ffffff;
    padding: 40px 20px 20px;
}

.footer-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
}

/* Footer Sections */
.footer-section {
    flex: 1 1 100%;
}

.footer-section h3 {
    margin-bottom: 15px;
}

.footer-section p,
.footer-section ul li {
    font-size: 0.95rem;
    margin-bottom: 8px;
}

.footer-section ul {
    list-style: none;
}

.footer-section ul li a {
    color: #cccccc;
    text-decoration: none;
}

.footer-section ul li a:hover {
    color: #ffffff;
}

/* Social Icons */
.social-icons {
    display: flex;
    gap: 15px;
}

.social-icons img {
    width: 30px;
    height: 30px;
    filter: invert(1);
}

/* Tablet View - 2 Columns */
@media (min-width: 600px) {
    .footer-section {
        flex: 1 1 45%;
    }

    .social-icons img {
        width: 26px;
        height: 26px;
    }
}

/* Desktop View - 4 Columns */
@media (min-width: 1024px) {
    .footer-section {
        flex: 1 1 22%;
    }

    .social-icons img {
        width: 24px;
        height: 24px;
    }
}

.footer-bottom {
    text-align: center;
    margin-top: 30px;
    font-size: 0.85rem;
    color: #bbbbbb;
}

    </style>
</head>
<body>

    <footer class="footer">
        <div class="footer-container">

            <div class="footer-section">
                <h3>About Us</h3>
                <p>We provide modern web solutions for businesses worldwide.</p>
            </div>

            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>

            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: info@example.com</p>
                <p>Phone: +91 98765 43210</p>
                <p>Location: Chennai, India</p>
            </div>

            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook"></a>
                    <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitter.svg" alt="Twitter"></a>
                    <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn"></a>
                </div>
            </div>

        </div>

        <p class="footer-bottom">© 2025 Vetri Technology Solutions. All rights reserved.</p>
    </footer>

</body>
</html>
