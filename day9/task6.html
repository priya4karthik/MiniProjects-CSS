<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members Grid</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

.title {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
    color: white;
}

/* Grid Layout */
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Required */
    gap: 20px;
}

/* Team Cards */
.card {
    background: rgb(244, 243, 243);
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: scale(1.05); /* Hover effect */
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

/* Profile Images */
.card img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
}

/* Role Text */
.role {
    color: #777;
    margin-bottom: 15px;
}

/* Social Icons */
.social i {
    font-size: 20px;
    margin: 0 8px;
    color: #555;
    cursor: pointer;
    transition: color 0.3s ease;
}

.social i:hover {
    color: #007bff;
}

    </style>

    <!-- Optional: Font Awesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body style="background: url(https://img.freepik.com/free-vector/modern-abstract-dark-violate-pink-background_84443-2788.jpg);">

<h1 class="title">Our Team</h1>

<div class="team-grid">

        </div>
    </div>

    <div class="card">
        <img src="https://img.freepik.com/free-photo/front-view-business-woman-suit_23-2148603018.jpg?semt=ais_hybrid&w=740&q=80" alt="Team Member">
        <h2>Sarah Smith</h2>

        <div class="social">
            <i class="fab fa-facebook"></i>

    </div>

    <div class="card">
        <img src="https://images.ctfassets.net/h6goo9gw1hh6/2sNZtFAWOdP1lmQ33VwRN3/24e953b920a9cd0ff2e1d587742a2472/1-intro-photo-final.jpg?w=1200&h=992&fl=progressive&q=70&fm=jpg" alt="Team Member">
        <h2>Michael Brown</h2>

</div>

</body>
</html>
