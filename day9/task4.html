<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

/* Grid Layout */
.dashboard {
    display: grid;
    grid-template-columns: 250px 1fr; /* Sidebar + Main */
    grid-template-rows: 100vh;
}

/* Sidebar */
.sidebar {
    background: #2c2c2c;
    color: white;
    padding: 20px;
}

.sidebar h2 {
    margin-top: 0;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar ul li {
    padding: 12px 0;
    cursor: pointer;
}

/* Main Content */
.main {
    padding: 20px 30px;
}

.main h1 {
    margin-top: 0;
}

/* Widgets Grid */
.widgets {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 widgets */
    gap: 15px; /* spacing */
}

.widget {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    font-size: 18px;
}

    </style>
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li>🏠 Home</li>
            <li>📊 Analytics</li>
            <li>⚙️ Settings</li>
            <li>🚪 Logout</li>
        </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
        <h1>Welcome to the Dashboard</h1>
        <p>This is a responsive dashboard layout using CSS Grid.</p>

        <!-- Widgets -->
        <div class="widgets">
            <div class="widget">📈 Sales Report</div>
            <div class="widget">👥 User Statistics</div>
            <div class="widget">💰 Revenue</div>
        </div>
    </main>

</div>

</body>
</html>
