<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Landing Page</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #111;
    color: #fff;
}

/* HERO SECTION */
.hero {
    min-height: 100vh;
    background: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085')
                center/cover no-repeat;
    filter: brightness(0.9);
    display: flex;
    flex-direction: column;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
}

.navbar ul {
    list-style: none;
    display: flex;
    gap: 20px;
}

.navbar a {
    color: white;
    text-decoration: none;
    transition: color 0.3s;
}

.navbar a:hover {
    color: #ff4081;
}

/* GLASS EFFECT */
.glass {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 40px;
}

/* HERO CONTENT */
.hero-content {
    margin: auto;
    text-align: center;
    max-width: 500px;
}

.hero-content h1 {
    font-size: 3rem;
    margin-bottom: 15px;
}

/* BUTTONS */
.btn-group {
    margin-top: 25px;
}

.btn {
    padding: 12px 28px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 5px;
    transition: transform 0.3s, box-shadow 0.3s;
}

.btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.primary {
    background: #ff4081;
    color: white;
}

.secondary {
    background: transparent;
    border: 2px solid #fff;
    color: #fff;
}

/* TOOLTIP */
.tooltip {
    position: relative;
}

.tooltip-text {
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: black;
    padding: 5px 10px;
    border-radius: 5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    font-size: 12px;
}

.tooltip:hover .tooltip-text {
    opacity: 1;
}

/* MODAL */
#modal-toggle {
    display: none;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
}

#modal-toggle:checked ~ .modal {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    width: 300px;
    text-align: center;
    transform: scale(0.7);
    transition: transform 0.4s;
}

#modal-toggle:checked ~ .modal .modal-content {
    transform: scale(1);
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 22px;
    cursor: pointer;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .hero-content h1 {
        font-size: 2rem;
    }
}

    </style>
</head>
<body>

<header class="hero">
    <nav class="navbar">
        <h2>Brand</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="hero-content glass">
        <h1>Modern Landing Page</h1>
        <p>Clean UI with animations and frosted glass effect</p>

        <div class="btn-group">
            <button class="btn primary">Get Started</button>

            <label for="modal-toggle" class="btn secondary tooltip">
                Learn More
                <span class="tooltip-text">Click to open modal</span>
            </label>
        </div>
    </div>
</header>

<!-- MODAL -->
<input type="checkbox" id="modal-toggle">

<div class="modal">
    <div class="modal-content glass">
        <label for="modal-toggle" class="close">&times;</label>
        <h2>About This Project</h2>
        <p>This landing page demonstrates CSS transitions, animations, and frosted UI.</p>
    </div>
</div>

</body>
</html>
