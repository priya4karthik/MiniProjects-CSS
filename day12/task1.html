<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Progress Bar Animation</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: #fff;
    padding: 30px;
    width: 320px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.progress-box {
    margin-bottom: 15px;
}

.progress-box span {
    font-size: 14px;
    font-weight: bold;
}

.progress {
    background: #ddd;
    border-radius: 20px;
    height: 12px;
    margin-top: 5px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    border-radius: 20px;
    animation: fill 2s ease forwards;
}

/* Individual progress values */
.progress-fill.html {
    width: 90%;
    background: #e44d26;
}

.progress-fill.css {
    width: 80%;
    background: #264de4;
}

.progress-fill.js {
    width: 65%;
    background: #f0db4f;
}

/* Animation */
@keyframes fill {
    from {
        width: 0;
    }
}

    </style>
</head>
<body>

<div class="container">
    <h2>Skill Progress</h2>

    <div class="progress-box">
        <span>HTML</span>
        <div class="progress">
            <div class="progress-fill html"></div>
        </div>
    </div>

    <div class="progress-box">
        <span>CSS</span>
        <div class="progress">
            <div class="progress-fill css"></div>
        </div>
    </div>

    <div class="progress-box">
        <span>JavaScript</span>
        <div class="progress">
            <div class="progress-fill js"></div>
        </div>
    </div>
</div>

</body>
</html>
