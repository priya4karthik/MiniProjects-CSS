<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animated Loading Spinner</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 50px;
    background: #f0f2f5;
}

/* 1. Circle Spinner */
.spinner-circle {
    width: 60px;
    height: 60px;
    border: 6px solid #ddd;
    border-top: 6px solid #2196f3;
    border-radius: 50%;
    animation: rotate 1s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 2. Dots Spinner */
.spinner-dots {
    display: flex;
    gap: 10px;
}

.spinner-dots div {
    width: 12px;
    height: 12px;
    background: #ff4081;
    border-radius: 50%;
    animation: bounce 1s infinite ease-in-out;
}

.spinner-dots div:nth-child(1) { animation-delay: 0s; }
.spinner-dots div:nth-child(2) { animation-delay: 0.2s; }
.spinner-dots div:nth-child(3) { animation-delay: 0.4s; }
.spinner-dots div:nth-child(4) { animation-delay: 0.6s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

/* 3. Bars Spinner */
.spinner-bars {
    display: flex;
    gap: 5px;
    height: 40px;
}

.spinner-bars div {
    width: 6px;
    background: #4caf50;
    animation: bar-scale 1s infinite ease-in-out;
}

.spinner-bars div:nth-child(1) { animation-delay: 0s; }
.spinner-bars div:nth-child(2) { animation-delay: 0.2s; }
.spinner-bars div:nth-child(3) { animation-delay: 0.4s; }
spinner-bars div:nth-child(4) { animation-delay: 0.6s; }

@keyframes bar-scale {
    0%, 40%, 100% { transform: scaleY(0.3); }
    20% { transform: scaleY(1); }
}

    </style>
</head>
<body>

<div class="spinner-circle"></div>
<div class="spinner-dots">
    <div></div><div></div><div></div><div></div>
</div>
<div class="spinner-bars">
    <div></div><div></div><div></div><div></div>
</div>

</body>
</html>
