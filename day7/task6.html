<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Flex Navbar</title>
    <style>
        body {
    margin: 0;
    font-family: "Poppins", sans-serif;
}

/* Premium Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
     background: linear-gradient(90deg, #003b95, #0057d9); 
    /* background: linear-gradient(90deg, #e3f2ff, #b9d9ff, #d9e7ff); */
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    position: relative;
}

/* Logo Styling */
.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo span {
    color: #ffdd57;
}

/* Menu Links Desktop */
.nav-links {
    list-style: none;
    display: flex;
    gap: 30px;
    margin: 0;
    padding: 0;
}

.nav-links li a {
    text-decoration: none;
     color: white;
    font-size: 16px;
    font-weight: 500;
    transition: 0.3s ease;
}

.nav-links li a:hover {
    color: #ffdd57;
}

/* Hide default checkbox */
#menu-toggle {
    display: none;
}

/* Hamburger Icon */
.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 6px;
}

.hamburger span {
    width: 28px;
    height: 3px;
    background: white;
    border-radius: 3px;
    transition: 0.3s;
}

/* Responsive Styling */
@media (max-width: 768px) {

    /* Show hamburger */
    .hamburger {
        display: flex;
    }

    /* Hide desktop menu */
    .nav-links {
        position: absolute;
        top: 70px;
        right: 0;
        width: 100%;
        background: #00306f;
        flex-direction: column;
        gap: 20px;
        padding: 25px 0;
        text-align: center;
        height: 0;
        overflow: hidden;
        transition: 0.4s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* Show menu when checkbox checked */
    #menu-toggle:checked ~ .nav-links {
        height: 220px;
    }

    /* Animate hamburger into 'X' */
    #menu-toggle:checked + .hamburger span:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
    }

    #menu-toggle:checked + .hamburger span:nth-child(2) {
        opacity: 0;
    }

    #menu-toggle:checked + .hamburger span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
    }
}

    </style>
</head>
<body>

    <nav class="navbar">

        <div class="logo">Vetri<span>Tech</span></div>

        <!-- Hamburger checkbox -->
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <!-- Navigation links -->
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

</body>
</html>
