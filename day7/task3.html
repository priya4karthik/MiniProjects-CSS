<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Gallery</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #000000;
    margin: 0;
    padding: 20px;
}

.title {
    text-align: center;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: 600;
    color: aliceblue;
}

.gallery {
    display: flex;
    flex-wrap: wrap;              /* allows wrapping */
    justify-content: center;      /* center the images */
    gap: 15px;                    /* spacing between images */
}

.gallery img {
    width: 300px;
    height: 200px;
    object-fit: cover;            /* keeps image shape clean */
    border-radius: 1px;
    border: 2px dotted white;
    /* box-shadow: 0 4px 10px rgba(0,0,0,0.1); */
    transition: 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

    </style>
</head>
<body>

    <h2 class="title">Flexbox Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/300/200?1" alt="">
        <img src="https://picsum.photos/300/200?2" alt="">
        <img src="https://picsum.photos/300/200?3" alt="">
        <img src="https://picsum.photos/300/200?4" alt="">
        <img src="https://picsum.photos/300/200?5" alt="">
        <img src="https://picsum.photos/300/200?6" alt="">
    </div>

</body>
</html>
