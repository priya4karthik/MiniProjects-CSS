<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table with Icons</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
    font-family: "Poppins", sans-serif;
    background: #f2f6fa;
    margin: 0;
    padding: 40px 20px;
}

.title {
    text-align: center;
    font-size: 32px;
    font-weight: 600;
    margin-bottom: 40px;
}

.pricing-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

/* Pricing card */
.pricing-card {
    background: #fff;
    width: 280px;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: 0.3s ease;
}

.pricing-card:hover {
    transform: translateY(-10px);
}

/* Icons */
.icon {
    font-size: 50px;
    color: #4b4bff;
    margin-bottom: 15px;
}

.highlight .icon {
    color: #fff;
}

/* Plan title */
.pricing-card h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

/* Price */
.price {
    font-size: 38px;
    font-weight: 700;
    margin-bottom: 20px;
}

.price span {
    font-size: 14px;
    color: #555;
}

/* Features */
.pricing-card ul {
    list-style: none;
    padding: 0;
    margin-bottom: 25px;
}

.pricing-card ul li {
    padding: 8px 0;
    color: #444;
    font-size: 15px;
}

.pricing-card ul li i {
    color: #00c853;
    margin-right: 8px;
}

/* Button */
button {
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #4b4bff;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #2d2dff;
}

/* Highlighted Card */
.highlight {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
    transform: scale(1.07);
}

.highlight ul li {
    color: #eefbff;
}

.highlight button {
    background: #fff;
    color: #008fcc;
}

.highlight button:hover {
    background: #e7faff;
}

    </style>
</head>
<body>

    <h2 class="title">Choose Your Plan</h2>

    <div class="pricing-container">

        <!-- Basic Plan -->
        <div class="pricing-card">
            <i class="fa-solid fa-leaf icon"></i>
            <h3>Basic</h3>
            <p class="price">$9<span>/mo</span></p>
            <ul>
                <li><i class="fa-solid fa-check"></i> 1 Project</li>
                <li><i class="fa-solid fa-check"></i> 5 GB Storage</li>
                <li><i class="fa-solid fa-check"></i> Email Support</li>
            </ul>
            <button>Choose Plan</button>
        </div>

        <!-- PRO Plan (Highlighted) -->
        <div class="pricing-card highlight">
            <i class="fa-solid fa-bolt icon"></i>
            <h3>Pro</h3>
            <p class="price">$19<span>/mo</span></p>
            <ul>
                <li><i class="fa-solid fa-check"></i> 10 Projects</li>
                <li><i class="fa-solid fa-check"></i> 50 GB Storage</li>
                <li><i class="fa-solid fa-check"></i> Priority Support</li>
            </ul>
            <button class="btn-highlight">Choose Plan</button>
        </div>

        <!-- Premium Plan -->
        <div class="pricing-card">
            <i class="fa-solid fa-gem icon"></i>
            <h3>Premium</h3>
            <p class="price">$29<span>/mo</span></p>
            <ul>
                <li><i class="fa-solid fa-check"></i> Unlimited Projects</li>
                <li><i class="fa-solid fa-check"></i> 200 GB Storage</li>
                <li><i class="fa-solid fa-check"></i> 24/7 Support</li>
            </ul>
            <button>Choose Plan</button>
        </div>

    </div>

</body>
</html>
