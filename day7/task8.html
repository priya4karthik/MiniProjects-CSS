<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100%;
  }

  .container {
    display: flex;
    height: 100vh;
  }

  .map {
    flex: 1;
  }

  .map iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .contact-form {
    flex: 1;
    background-color: #000;
    color: #fff;
    padding: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .contact-form h1 {
    margin-bottom: 30px;
    font-size: 32px;
  }

  .contact-form label {
    margin-bottom: 5px;
    font-weight: bold;
  }

  .contact-form input, 
  .contact-form textarea {
    margin-bottom: 20px;
    padding: 10px;
    width: 100%;
    border-bottom: 2px solid #fff;
    background: transparent;
    color: #fff;
    font-size: 16px;
  }

  .contact-form input::placeholder,
  .contact-form textarea::placeholder {
    color: #ccc;
  }

  .contact-form button {
    padding: 12px;
    border: none;
    background-color: #fff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .contact-form button:hover {
    background-color: #444;
    color: #fff;
  }
</style>
</head>
<body>

<div class="container">
  <div class="map">
   <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d124379.72307446694!2d77.47837519225578!3d13.044178267652654!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1765b5eaaaab%3A0x7e080adef1489e8d!2sCognizant%20Technology%20Solutions!5e0!3m2!1sen!2sin!4v1764941360251!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  
  <div class="contact-form">
    <h1>Contact Us</h1>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Enter your message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</div>

</body>
</html>
