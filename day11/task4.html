<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Badge</title>
  <style>
    /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Center on page */
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
}

/* Parent container */
.notification {
  position: relative;
  width: 80px;
  height: 80px;
  background: #e6e6e6;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Bell icon */
.bell {
  font-size: 36px;
  color: #f4b400;
}

/* Badge */
.badge {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 22px;
  height: 22px;
  background: #ff0000;
  color: #fff;
  border-radius: 50%;
  font-size: 13px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
}

  </style>
</head>
<body>

  <div class="notification">
    <span class="bell">🔔</span>
    <span class="badge">3</span>
  </div>

</body>
</html>
